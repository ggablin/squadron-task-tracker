<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Promotion Package Checklist — 108th CES</title>
<!-- Printable, blank copy of the checklist the Promotion tab renders live.
     Same data file (promotion-package.js), so the two can't drift. No member
     data on this page. Shell, tokens and theme handling mirror /records. -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="theme-color" id="theme-color" content="#f6f7ed">
<script>
(function(){try{
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function stored(){try{return localStorage.getItem('theme');}catch(e){return null;}}
  function paint(d){
    if(d)document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;
    var m=document.getElementById('theme-color');
    if(m)m.setAttribute('content',d?'#2a2724':'#f6f7ed');
  }
  var s=stored();paint(s==='dark'||(s!=='light'&&mq.matches));
  var f=function(e){if(!stored())paint(e.matches);};
  if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f);
  window.__setTheme=paint;
}catch(e){}})();
</script>
<link rel="stylesheet" href="/design.css">
<style>
@font-face { font-family:'General Sans'; src:url('/fonts/general-sans-400.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'General Sans'; src:url('/fonts/general-sans-500.woff2') format('woff2'); font-weight:500; font-display:swap; }
@font-face { font-family:'General Sans'; src:url('/fonts/general-sans-600.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'General Sans'; src:url('/fonts/general-sans-700.woff2') format('woff2'); font-weight:700; font-display:swap; }

* { box-sizing:border-box; }
body {
  margin:0; background:var(--cream); color:var(--text);
  font-family:'General Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.page { max-width:960px; margin:0 auto; padding:28px 20px 60px; }

/* ── top bar: same shell as /records ── */
.topbar { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
.brand { font-size:20px; font-weight:700; letter-spacing:-.02em; }
.brand .sep { color:var(--t3); font-weight:400; margin:0 6px; }
.brand .screen-name { color:var(--t2); font-weight:600; }
.top-sub { font-size:13px; color:var(--t2); margin-bottom:22px; }
.topbar-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
/* Print is the primary action on this page, so it wears the inverted pill;
   the back link takes the outline form instead of competing with it. */
.print-btn {
  display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 16px 0 12px;
  border-radius:999px; border:2px solid var(--text); background:var(--text); color:var(--bg);
  font:inherit; font-size:12.5px; font-weight:700; letter-spacing:.02em; cursor:pointer;
  transition:background .12s, color .12s;
}
.print-btn:hover { background:var(--bg); color:var(--text); }
.print-btn svg { width:15px; height:15px; }
.back-link.quiet { background:var(--bg); color:var(--text); border-color:var(--border); }
.back-link.quiet:hover { border-color:var(--text); }
.theme-toggle-btn {
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%; border:2px solid var(--border);
  background:var(--bg); color:var(--t2); flex-shrink:0; cursor:pointer;
  transition:background .12s, border-color .12s;
}
.theme-toggle-btn:hover { background:var(--cream); border-color:var(--bm); }
.theme-toggle-btn svg { width:17px; height:17px; }
.theme-toggle-btn .icon-sun { display:none; }
[data-theme="dark"] .theme-toggle-btn .icon-moon { display:none; }
[data-theme="dark"] .theme-toggle-btn .icon-sun  { display:inline-flex; }

/* ── the sheet: the app's cards, microlabels and numbered badges ── */
.pc-grid { display:grid; grid-template-columns:1.15fr 1fr; gap:14px; align-items:start; }
.pc-col { display:flex; flex-direction:column; gap:14px; min-width:0; }
.pc-card { background:var(--bg); border:2px solid var(--border); border-radius:var(--r); padding:18px 20px; break-inside:avoid; }
.pc-microlabel { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--t2); margin-bottom:12px; }
.pc-sub { font-size:12px; font-weight:500; color:var(--t2); }
.pc-list { list-style:none; margin:0; padding:0; }
.pc-row { display:flex; align-items:center; gap:9px; font-size:13.5px; padding:5px 0; }
.pc-circle { width:16px; height:16px; flex-shrink:0; border-radius:50%; border:1.5px solid var(--t3); background:var(--bg); }
.pc-circle.sm { width:12px; height:12px; }
.pc-item { display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--border); break-inside:avoid; }
.pc-items > :first-child, .pc-orders > :first-child { border-top:0; padding-top:0; }
.pc-n {
  width:24px; height:24px; flex-shrink:0; border-radius:7px; margin-top:1px;
  background:var(--cream); color:var(--t2);
  font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;
  display:flex; align-items:center; justify-content:center;
}
.pc-body { flex:1; min-width:0; }
.pc-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; }
.pc-checks { list-style:none; margin:6px 0 0 25px; padding:0; display:flex; flex-direction:column; gap:4px; }
.pc-checks li { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--t2); }
.pc-order { display:flex; align-items:center; gap:12px; font-size:13.5px; padding:7px 0; border-top:1px solid var(--border); }
.pc-field { display:flex; align-items:baseline; gap:10px; padding:7px 0; font-size:13px; }
.pc-field-lbl { color:var(--t2); white-space:nowrap; }
.pc-blank { flex:1; border-bottom:1.5px solid var(--bm); height:16px; }
.pc-box { height:104px; border:1.5px dashed var(--bm); border-radius:var(--rs); background:var(--cream); }
.foot-note { margin-top:34px; font-size:11.5px; color:var(--t3); line-height:1.6; text-align:center; }

@media (max-width:700px) { .pc-grid { grid-template-columns:1fr; } }

/* ── paper: white, no chrome, tokens forced to light so a dark-mode phone
   doesn't print a dark sheet ── */
@media print {
  @page { margin:12mm; }
  :root, [data-theme="dark"] {
    --cream:#f6f7ed; --bg:#fff; --border:#e2e2da; --bm:#c8c8bf; --text:#111; --t2:#555; --t3:#888;
  }
  body { background:#fff; }
  .page { max-width:none; padding:0; }
  .topbar-actions, .foot-note { display:none; }
  .top-sub { margin-bottom:12px; }
  .pc-grid { gap:10px; }
  .pc-card { padding:12px 14px; border-width:1.5px; }
  .pc-circle { border-color:#333; }
  .pc-n { border:1px solid #ddd; }
  .pc-box { height:88px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">108th CES<span class="sep">·</span><span class="screen-name">Promotion Package Checklist</span></div>
    <div class="topbar-actions">
      <a class="back-link quiet" href="/" title="Back to tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Tracker</a>
      <button class="print-btn" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
        Print / Save as PDF
      </button>
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="top-sub">FSS Promotion Package Checklist &middot; blank copy for one member &middot; the live version with form links is under Resources &rarr; Promotion</div>

  <div id="sheet">Loading&hellip;</div>

  <div class="foot-note">108th CES Squadron Task Tracker &mdash; printable checklist</div>
</div>
<script src="/promotion-package.js"></script>
<script>
function toggleTheme(){
  var dark=document.documentElement.dataset.theme!=='dark';
  var osDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  try{ if(dark===osDark) localStorage.removeItem('theme'); else localStorage.setItem('theme',dark?'dark':'light'); }catch(e){}
  (window.__setTheme||function(){})(dark);
}
document.getElementById('sheet').innerHTML = window.PromoPackage.printableHTML();
</script>
</body>
</html>
